[package]
name = "conet"
version = "0.1.0"
edition = "2021"

[dependencies]
boringtun = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
bytes = "1"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
hex = "0.4"
rand = "0.8"

