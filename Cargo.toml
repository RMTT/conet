[package]
name = "conet"
version = "0.1.0"
edition = "2021"

[dependencies]
boringtun = {git="https://github.com/RMTT/boringtun.git", branch="master"}
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
bytes = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
tun-rs = { version = "2.7", features = ["async"] }
async-trait = "0.1"
async-channel = "2"
num_cpus = "1"
futures = "0.3"
base64 = "0.22.1"
ipnet = { version = "2.11.0", features = ["serde"] }
nix = { version = "0.30.1", features = ["net", "socket"] }
tokio-util = "0.7.17"
socket2 = "0.6.1"
